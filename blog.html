      <p>The Ramayana isn’t just a story about a prince rescuing his wife — it’s one of the richest guides to human values ever written, still shaping how millions of Indians think about duty, loyalty, and integrity today.</p>

      <h3>The Story, In Brief</h3>
      <p>Prince Rama of Ayodhya, the eldest and most beloved son of King Dashrath, is set to be crowned king — until a last-minute political twist sends him into 14 years of forest exile instead, along with his wife Sita and his devoted brother Lakshman.</p>
      <p>During this exile, the demon king Ravana of Lanka kidnaps Sita. What follows is a war for her rescue, alliances with the vanara (monkey) kingdom led by the wise Sugriva, an army built with the help of the mighty Hanuman, and eventually, Ravana’s defeat. But reducing the Ramayana to “hero rescues wife” misses everything that makes it powerful.</p>

      <h3>The Deeper Lessons</h3>
      <ol>
        <li><strong>Dharma Over Convenience:</strong> Rama accepts exile without protest — not because he’s powerless, but because keeping his father’s word matters more to him than his own comfort or claim to the throne. This is the essence of dharma: doing what’s right, even when it costs you.</li>
        <li><strong>Loyalty That Isn’t Blind:</strong> Lakshman leaves behind a comfortable royal life to accompany his brother into the forest — not out of obligation, but genuine devotion. Hanuman’s loyalty to Rama, similarly, becomes a symbol of selfless service (seva) without expecting anything in return.</li>
        <li><strong>Strength Through Humility:</strong> Hanuman, despite possessing immense power, remains humble throughout the story. His strength is remembered not because he seeks glory, but because he uses it in service of others — a message that still resonates in how we think about leadership today.</li>
        <li><strong>Every Character Has a Choice:</strong> Even Ravana, the antagonist, is shown as a brilliant scholar and powerful king — not a one-dimensional villain. His downfall comes from unchecked ego and desire, not lack of ability. The Ramayana teaches that our choices, not our capabilities, define us.</li>
      </ol>

      <div class="blog-highlight-box">
        <strong>Why It Still Matters:</strong> The Ramayana is often called “Maryada Purushottam” — the story of the ideal man who upholds dignity and duty in every relationship: as a son, husband, brother, and king. Reading it isn’t about religious obligation; it’s a study of how to navigate difficult choices with integrity.
      </div>

      <p>The Mahabharata is often remembered for one thing: the great war at Kurukshetra between the Kauravas and Pandavas. But the war is only the final chapter of a much bigger story about family, power, jealousy, and the complicated nature of right and wrong.</p>

      <h3>Setting the Scene</h3>
      <p>Two sets of cousins — the hundred Kaurava brothers led by Duryodhana, and the five Pandava brothers led by Yudhishthira — grow up together, but rivalry brews early. Duryodhana’s jealousy toward the Pandavas, especially after they build a magnificent palace and grow in strength and popularity, sets the stage for a lifelong conflict.</p>
      <p>Things escalate through a rigged game of dice, where Yudhishthira loses everything — his kingdom, his brothers’ freedom, and even his wife Draupadi is publicly humiliated. The Pandavas are exiled for 13 years. When they return and rightfully ask for their kingdom back, Duryodhana refuses even a share of five villages. War becomes inevitable.</p>

      <h3>Why the Mahabharata Is So Complex</h3>
      <p>Unlike many epics with a clear “good side” and “bad side,” the Mahabharata deliberately blurs those lines:</p>
      <ul>
        <li>Karna, technically on the Kaurava side, is one of the most tragic and honorable characters in the story.</li>
        <li>Bhishma and Dronacharya, teachers to the Pandavas, still fight for the Kauravas out of duty.</li>
        <li>Even Yudhishthira, the most righteous of the Pandavas, tells one lie during the war — showing that even the most dutiful person faces impossible moral choices.</li>
      </ul>

      <h3>The Bhagavad Gita — The Heart of the Epic</h3>
      <p>Right before the war begins, Arjuna — one of the Pandava brothers and a skilled warrior — is overwhelmed with doubt. He doesn’t want to fight his own family and teachers. It’s at this moment that Krishna delivers the Bhagavad Gita, a conversation about duty, purpose, and the nature of the self.</p>

        2. Power struggles rarely have simple villains.<br/>
        3. Dharma isn’t always black and white — sometimes doing right requires painful choices.<br/>
        4. Even the wisest struggle with doubt — questioning your path is human, not weakness.
      </div>

      <p>The word “Veda” comes from the Sanskrit root “vid,” meaning “to know.” The Vedas are considered among the oldest sacred texts in the world, passed down orally for generations.</p>

        <li><strong>Jyotirmath (Badrinath)</strong> in the North</li>
      </ul>
      <p>His commentaries on the Bhagavad Gita, Upanishads, and Brahma Sutras remain foundational works of Indian philosophy.</p>
    `
  }
];

function renderBlogs(filter = 'all') {
  const container = document.getElementById('blog-grid-container');
  container.innerHTML = '';

  const filtered = filter === 'all' ? BLOGS : BLOGS.filter(b => b.category === filter);

  filtered.forEach(blog => {
    const card = document.createElement('article');
    card.className = 'blog-card';
    card.dataset.cat = blog.category;

    card.innerHTML = `
      <div class="blog-img">
        <div class="blog-img-ph" style="background:${blog.bannerBg}">${blog.bannerText}</div>
      </div>
      <div class="blog-meta">
        <span class="blog-tag-badge">${blog.badge}</span>
        <h3>${blog.title}</h3>
        <p>${blog.excerpt}</p>
        <div class="blog-card-footer">
          <button class="blog-read-btn" onclick="openBlogModal(${blog.id})">Read Article →</button>
          <span class="blog-date">${blog.date}</span>
        </div>
      </div>
    `;
    container.appendChild(card);
  });

  // Animate cards in after render
  requestAnimationFrame(() => {
    container.querySelectorAll('.blog-card').forEach((card, i) => {
      card.style.opacity = '0';
      card.style.transform = 'translateY(20px)';
      card.style.transition = `opacity .45s ease ${i * 0.08}s, transform .45s ease ${i * 0.08}s`;
      requestAnimationFrame(() => {
        card.style.opacity = '1';
        card.style.transform = 'translateY(0)';
      });
    });
  });
}

function openBlogModal(id) {
  const blog = BLOGS.find(b => b.id === id);
  if (!blog) return;

  document.getElementById('modalTag').textContent = blog.badge;
  document.getElementById('modalTitle').textContent = blog.title;
  document.getElementById('modalBody').innerHTML = blog.content;

  const overlay = document.getElementById('blogModalOverlay');
  overlay.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeBlogModal(e) {
  const overlay = document.getElementById('blogModalOverlay');
  overlay.classList.remove('active');
  document.body.style.overflow = '';
}

// Category filter listener
document.querySelectorAll('.bf-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.bf-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderBlogs(btn.dataset.cat);
  });
});

// Initial render & handle query parameter e.g. blog.html?id=1
window.addEventListener('DOMContentLoaded', () => {
  renderBlogs('all');
  const params = new URLSearchParams(window.location.search);
  const idParam = params.get('id');
  if (idParam) {
    openBlogModal(parseInt(idParam, 10));
  }
});
</script>
